# This workflow will test the go package against Sideko's Mock Servers
# Tests will run automatically on a push to `main` or a pull request event

name: Run Tests

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.20"
          - "1.22"
          - "1.24"
          - "stable"
    steps:
      #----------------------------------------------
      #  -----  checkout & setup go  -----
      #----------------------------------------------
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
      #---------------------------------------------------
      #  -----  load cached go deps if cache exists -----
      #---------------------------------------------------
      - name: load cached go dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
      #---------------------------------------------------
      #  -----  install dependencies -----
      #---------------------------------------------------
      - name: install dependencies
        run: |
          go mod tidy
          go mod download
      #------------------------------
      #  -----  run tests -----
      #------------------------------
      - name: run tests
        run: go test ./... -v
